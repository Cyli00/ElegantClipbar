name: Build macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build universal macOS app
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Run this workflow against a version tag, such as v0.1.0.' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vx.y.z.' >&2
            exit 1
          fi
          declared_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$version" != "$declared_version" ]]; then
            echo 'The release tag must match Resources/Info.plist.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Swift Testing
        run: make test

      - name: Package Apple Silicon and Intel app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make universal

      - name: Verify app bundle
        run: |
          plutil -lint build/universal/ElegantClipbar.app/Contents/Info.plist
          lipo build/universal/ElegantClipbar.app/Contents/MacOS/ElegantClipbar -verify_arch arm64 x86_64
          codesign --verify --strict build/universal/ElegantClipbar.app
          test -s build/universal/ElegantClipbar.app/Contents/Resources/AppIcon.icns
          test -s build/universal/ElegantClipbar.app/Contents/Resources/BrandIcon.png
          test -s build/universal/ElegantClipbar.app/Contents/Resources/StatusIconTemplate.png

      - name: Archive app and checksum
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="ElegantClipbar-${APP_VERSION}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent build/universal/ElegantClipbar.app "build/$archive"
          cd build
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ElegantClipbar-${{ steps.version.outputs.version }}-macOS-universal
          path: |
            build/ElegantClipbar-*.zip
            build/ElegantClipbar-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ElegantClipbar-${{ needs.build.outputs.version }}-macOS-universal
          path: release-assets

      - name: Verify checksum
        working-directory: release-assets
        run: sha256sum --check *.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "ElegantClipbar $RELEASE_TAG" \
            --generate-notes --latest \
            --notes 'Native macOS clipboard app for macOS 13 or later, supporting Apple Silicon and Intel. This build is ad-hoc signed and is not notarized. Native history starts empty; legacy Windows backups are unsupported.'
