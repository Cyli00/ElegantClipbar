name: macOS CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Swift tests and universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Compile
        run: make check

      - name: Swift Testing
        run: make test

      - name: Build Apple Silicon and Intel app
        run: make universal

      - name: Verify app bundle
        run: |
          plutil -lint build/universal/ElegantClipbar.app/Contents/Info.plist
          lipo build/universal/ElegantClipbar.app/Contents/MacOS/ElegantClipbar -verify_arch arm64 x86_64
          codesign --verify --strict build/universal/ElegantClipbar.app
